
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tot's Motorshop Login</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .input-error {
            border: 2px solid #dc2626 !important;
        }

        .login-box {
            text-align: center;
        }

        .login-box input[type="text"],
        .login-box input[type="password"] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 14px 0;
        }

        .login-box #loginBtn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 6px 0 0 0;
        }

        .login-message {
            min-height: 16px;
            margin: 8px 0 0;
            font-size: 13px;
            text-align: center;
            color: #dc2626;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 14px;
        }

        .password-container input {
            width: 100%;
            padding-right: 42px !important;
            box-sizing: border-box;
            margin: 0 !important;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            display: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        #loginBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <img src="logo.png" class="login-logo" alt="Tot's Motorshop Logo">

            <h2>Tot's Motorshop</h2>

            <p class="subtitle">Sales And Inventory Monitoring System</p>

            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                autocomplete="username"
            >

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    oninput="handlePasswordInput(this)"
                >

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="togglePasswordIcon"
                    onclick="togglePasswordVisibility()"
                ></i>

            </div>

            <button
                type="button"
                id="loginBtn"
                onclick="login()"
            >
                Login
            </button>

            <p id="loginMessage" class="login-message"></p>

        </div>

    </div>


    <script>

        // Redirect authenticated users to the dashboard.
        window.addEventListener("pageshow", function () {

            if (localStorage.getItem("authToken")) {
                window.location.replace("dashboard.html");
            }

        });


        // Login API endpoint.
        const API_URL = "/auth/login";


        // Display login error or information message.
        function setLoginMessage(text) {

            document.getElementById("loginMessage").textContent = text;

        }


        // Remove previous input error highlights.
        function clearLoginErrors() {

            document.getElementById("username")
                .classList.remove("input-error");

            document.getElementById("password")
                .classList.remove("input-error");

            setLoginMessage("");

        }


        // Login function.
        async function login() {

            const usernameInput = document.getElementById("username");

            const passwordInput = document.getElementById("password");

            const loginBtn = document.getElementById("loginBtn");

            const username = usernameInput.value.trim();

            const password = passwordInput.value.trim();


            clearLoginErrors();


            // Validate required fields.
            if (!username || !password) {

                if (!username) {
                    usernameInput.classList.add("input-error");
                }

                if (!password) {
                    passwordInput.classList.add("input-error");
                }

                setLoginMessage(
                    "Please enter your username and password."
                );

                return;

            }


            loginBtn.disabled = true;

            loginBtn.textContent = "Logging in...";


            try {

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


                const data = await response.json();


                if (data.success && data.token) {

                    // Save authentication token.
                    localStorage.setItem(
                        "authToken",
                        data.token
                    );


                    // Redirect to dashboard.
                    window.location.href = "dashboard.html";

                    return;

                }


                // Invalid username or password.
                usernameInput.classList.add("input-error");

                passwordInput.classList.add("input-error");

                setLoginMessage(
                    data.message || "Wrong username or password."
                );


            } catch (error) {

                console.error("Login Error:", error);

                setLoginMessage(
                    "Cannot connect to the server. Please try again."
                );

            }


            loginBtn.disabled = false;

            loginBtn.textContent = "Login";

        }


        // Allow Enter key to submit login.
        ["username", "password"].forEach(function (id) {

            const input = document.getElementById(id);

            input.addEventListener("keydown", function (event) {

                if (event.key === "Enter") {
                    login();
                }

            });


            input.addEventListener("input", clearLoginErrors);

        });


        // Show password icon when password is entered.
        function handlePasswordInput(input) {

            const toggleIcon = document.getElementById(
                "togglePasswordIcon"
            );

            if (input.value.trim().length > 0) {

                toggleIcon.style.display = "block";

            } else {

                toggleIcon.style.display = "none";

            }

        }


        // Show or hide password.
        function togglePasswordVisibility() {

            const passwordInput = document.getElementById("password");

            const toggleIcon = document.getElementById(
                "togglePasswordIcon"
            );


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleIcon.classList.remove("fa-eye");

                toggleIcon.classList.add("fa-eye-slash");

            } else {

                passwordInput.type = "password";

                toggleIcon.classList.remove("fa-eye-slash");

                toggleIcon.classList.add("fa-eye");

            }

        }

    </script>

</body>

</html>
