<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tot's Motorshop - Forgot Password</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .input-error {
            border: 2px solid #dc2626 !important;
        }

        .login-box {
            text-align: center;
        }

        .login-box input[type="text"],
        .login-box input[type="email"],
        .login-box input[type="password"] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 14px 0;
        }

        .login-box button.main-btn {

            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 6px 0 0 0;
        }

        .info-text {
            font-size: 13px;
            color: #555;
            margin: 0 0 18px;
        }

        .form-message {
            min-height: 18px;
            margin: 10px 0 0;
            font-size: 13px;
            text-align: center;
            color: #dc2626;
        }

        .form-message.success {
            color: #16a34a;
        }

        .bottom-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }


        #resetStep {
            display: none;
        }
    </style>

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <img src="logo.png" class="login-logo" alt="Tot's Motorshop Logo">

        <h2>Forgot Password</h2>

        <p class="subtitle">Tot's Motorshop Sales And Inventory Monitoring System</p>

        <div id="verifyStep">

            <p class="info-text">
                Enter your username and registered email to verify your account.
            </p>

            <input type="text" id="fpUsername" placeholder="Enter Username">

            <input type="email" id="fpEmail" placeholder="Enter Registered Email">

            <button type="button" class="main-btn" id="verifyBtn" onclick="verifyAccount()">
                Verify Account

            </button>

        </div>

        <div id="resetStep">

            <p class="info-text">
                Account verified. Enter your new password.
            </p>

            <input type="password" id="newPassword" placeholder="Enter New Password">

            <input type="password" id="confirmPassword" placeholder="Confirm New Password">

            <button type="button" class="main-btn" id="resetBtn" onclick="resetPassword()">
                Reset Password
            </button>

        </div>

        <p id="fpMessage" class="form-message"></p>

        <div class="bottom-links">
            <a href="login.html" class="register-link">Back to Login</a>
        </div>

    </div>

</div>



<script>

const VERIFY_URL = "http://localhost:5000/auth/verify-user";
const RESET_URL = "http://localhost:5000/auth/reset-password";

let verifiedUsername = "";
let verifiedEmail = "";


function setMessage(text, isSuccess) {

    const message = document.getElementById("fpMessage");

    message.textContent = text;
    message.classList.toggle("success", !!isSuccess);

}

function clearErrors() {

    ["fpUsername", "fpEmail", "newPassword", "confirmPassword"].forEach(id => {
        document.getElementById(id).classList.remove("input-error");
    });

    setMessage("");

}


["fpUsername", "fpEmail", "newPassword", "confirmPassword"].forEach(id => {
    document.getElementById(id).addEventListener("input", clearErrors);
});

async function verifyAccount() {

    const usernameInput = document.getElementById("fpUsername");
    const emailInput = document.getElementById("fpEmail");
    const verifyBtn = document.getElementById("verifyBtn");

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();

    clearErrors();

    if (!username || !email) {

        if (!username) usernameInput.classList.add("input-error");
        if (!email) emailInput.classList.add("input-error");

        setMessage("Please enter your username and email.");

        return;

    }


    verifyBtn.disabled = true;

    try {

        const response = await fetch(VERIFY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email })
        });

        const data = await response.json();

        if (data.success) {

            verifiedUsername = username;
            verifiedEmail = email;

            document.getElementById("verifyStep").style.display = "none";
            document.getElementById("resetStep").style.display = "block";

            setMessage("");

        } else {

            usernameInput.classList.add("input-error");
            emailInput.classList.add("input-error");

            setMessage(data.message || "Account not found.");

        }

    } catch (error) {


        console.error("Verify Error:", error);

        setMessage("Cannot connect to the server. Please make sure your server is running.");

    }

    verifyBtn.disabled = false;

}

async function resetPassword() {

    const newInput = document.getElementById("newPassword");
    const confirmInput = document.getElementById("confirmPassword");
    const resetBtn = document.getElementById("resetBtn");

    const newPassword = newInput.value;
    const confirmPassword = confirmInput.value;

    clearErrors();

    if (!newPassword || !confirmPassword) {

        if (!newPassword) newInput.classList.add("input-error");
        if (!confirmPassword) confirmInput.classList.add("input-error");


        setMessage("Please fill in both password fields.");

        return;

    }

    if (newPassword.length < 8) {

        newInput.classList.add("input-error");

        setMessage("Password must be at least 8 characters.");

        return;

    }

    if (newPassword !== confirmPassword) {

        newInput.classList.add("input-error");
        confirmInput.classList.add("input-error");

        setMessage("Passwords do not match.");

        return;

    }

    resetBtn.disabled = true;

    try {

        const response = await fetch(RESET_URL, {

            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: verifiedUsername,
                email: verifiedEmail,
                newPassword
            })
        });

        const data = await response.json();

        if (data.success) {
            
            window.location.href = "login.html";

            return;

        }

        setMessage(data.message || "Unable to reset password.");

    } catch (error) {

        console.error("Reset Error:", error);

        setMessage("Cannot connect to the server. Please make sure your server is running.");

    }

    resetBtn.disabled = false;


}

</script>

</body>

</html>
